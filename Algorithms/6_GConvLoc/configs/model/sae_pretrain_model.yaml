_target_: src.models.sae_module.StackedAutoencoderModule

mlp_hiddens: [128, 64]
hidden_activation: "relu"
output_activation: "none"
log_dir: ${paths.output_dir}

criterion:
  _target_: torch.nn.MSELoss

optimizer:
      _target_: src.utils.build_optimizer
      _partial_: True
      weight_decay: 0.0
      lr: 0.001
      opt: "adam"
      opt_scheduler: "none"
      opt_decay_step: 1000
      opt_decay_rate: 0.9
      epochs: 20000
