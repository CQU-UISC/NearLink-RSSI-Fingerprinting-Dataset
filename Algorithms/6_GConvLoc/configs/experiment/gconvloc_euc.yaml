# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  #- override /datamodule: UJIIndoorLoc_cdm_epsilon_graph.yaml
  #- override /datamodule: UJIIndoorLoc_cdm_knn_graph.yaml
  - override /datamodule: UJIIndoorLoc_euc_knn_graph.yaml
  - override /model: gconvloc_localize_model.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["UJIIndoorLoc", "gat_euc"]

seed: 0

trainer:
  min_epochs: 1
  max_epochs: 20000

datamodule:
  #epsilon: 3.0
  #pca: 0.99
  top_k: 23
  loader: "full"
  batch_size: 128
  num_neighbors: [-1, -1]  # number of hidden channels + 1 in gat model // number of hidden channels in gat+mlp

model:
  hidden_channels: [256, 128]
  activation: "relu"
  heads: 1
  conv_dropout: 0.0
  node_dropout: 0.0
  edge_dropout: 0.0
  share_weights: True
  output_activation: "none"
  normalize: True
  post_mlp_hiddens: [64]
  post_input_dropout: 0.0
  post_dropout: 0.0
  log_dir: ${paths.output_dir}
  optimizer:
    lr: 0.001
    opt: "adam"
    opt_scheduler: "none"
    epochs: 5000
  criterion:
    _target_: torch.nn.MSELoss
    #_target_: torch.nn.L1Loss

callbacks:
  early_stopping:
    patience: 20
    monitor: val/mean_error
  model_checkpoint:
    monitor: val/mean_error
    #save_last: True
    #every_n_epochs: 100

logger:
  wandb:
    tags: ${tags}
    group: "gat_euc"
    project: "GConvLoc"
