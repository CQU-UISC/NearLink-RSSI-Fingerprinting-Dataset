# @package _global_

defaults:
  # - override /datamodule: UJIIndoorLoc_cos_knn_graph.yaml
  # - override /datamodule: UJIIndoorLoc_cos_knn_graph_batch.yaml
  # - override /datamodule: UJIIndoorLoc_cos_knn_graph_B2.yaml
  # - override /datamodule: UJIIndoorLoc_cos_knn_graph_B1.yaml
  # - override /datamodule: UTSIndoorLoc_cos_knn_graph_batch.yaml
  - override /datamodule: SLE_cos_knn_graph.yaml
  # - override /datamodule: UTSIndoorLoc_gaussian_cos_knn_graph.yaml
  # - override /datamodule: Tampere_cos_knn_graph_batch.yaml
  # - override /datamodule: SYL_cos_knn_graph_batch.yaml
  # - override /datamodule: HCXY_cos_knn_graph_batch.yaml
  # - override /datamodule: CET311_cos_knn_graph_batch.yaml
  - override /model: gconvloc_localize_model_sle.yaml

tags: ["SLE", "gat"]

seed: 42

trainer:
  min_epochs: 1
  max_epochs: 20000

# datamodule:
#   top_k: 23
#   loader: "cluster"
#   batch_size: 128
#   cluster_size: 5
datamodule:
  top_k: 23
  loader: "full"
  batch_size: 128
  num_neighbors: [-1, -1]

model:
  hidden_channels: [256, 128]
  activation: "relu"
  heads: 1
  conv_dropout: 0.0
  node_dropout: 0.0
  edge_dropout: 0.0
  share_weights: True
  output_activation: "none"
  normalize: True
  post_mlp_hiddens: [64]
  post_input_dropout: 0.0
  post_dropout: 0.0
  log_dir: ${paths.output_dir}
  optimizer:
    lr: 0.001
    opt: "adam"
    opt_scheduler: "none"
    epochs: 5000
  criterion:
    _target_: torch.nn.MSELoss
    #_target_: torch.nn.L1Loss

callbacks:
  early_stopping:
    patience: 20
    monitor: val/mean_error
  model_checkpoint:
    monitor: val/mean_error
    #save_last: True
    #every_n_epochs: 100

logger:
  wandb:
    tags: ${tags}
    group: "gat"
    project: "GConvLoc"