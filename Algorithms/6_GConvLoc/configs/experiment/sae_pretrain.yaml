# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /datamodule: UJIIndoorLoc_matrix.yaml
  - override /model:  sae_pretrain_model.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["UJIIndoorLoc", "sae_pretrain"]

seed: 0

datamodule:
  batch_size: 66
  powered: True

trainer:
  min_epochs: 1
  max_epochs: 20000

model:
  mlp_hiddens: [128, 64]
  hidden_activation: "relu"
  output_activation: "none"
  optimizer:
    lr: 0.001
    opt: "adam"
    opt_scheduler: "none"
    epochs: 20000

save_path: ${paths.model_dir}/128_64_0.001_sae.ckpt

test: False

callbacks:
  early_stopping:
    patience: 20
    monitor: val/loss
  model_checkpoint:
    monitor: val/loss

logger:
  wandb:
    tags: ${tags}
    group: "sae_pretrain"
    project: "GConvLoc"
