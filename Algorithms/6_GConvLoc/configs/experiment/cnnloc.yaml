# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /datamodule: UJIIndoorLoc_matrix.yaml
  - override /model:  cnnloc_localize_model.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["UJIIndoorLoc", "cnnloc"]

seed: 123456

datamodule:
  batch_size: 66
  powered: True

trainer:
  min_epochs: 1
  max_epochs: 20000

model:
  sae_encoder_ckpt_path: ${paths.model_dir}/128-32_sae.ckpt
  conv_filters_kernel_sizes: [[99,22],[66,22],[33,22]]
  #conv_filters_kernel_sizes: [[66,6]]
  mlp_hiddens: []
  hidden_activation: "relu"
  output_activation: "none"
  optimizer:
    lr: 0.001
    opt: "adam"
    opt_scheduler: "none"
    epochs: 20000

callbacks:
  early_stopping:
    patience: 10
    monitor: val/mean_error
  model_checkpoint:
    monitor: val/mean_error

logger:
  wandb:
    tags: ${tags}
    group: "cnnloc_test"
    project: "GConvLoc"
